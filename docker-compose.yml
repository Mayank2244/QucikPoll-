# QuickPoll: Django + PostgreSQL. Same on Mac, Windows and Linux.
# Start:  docker compose up --build        Stop:  Ctrl+C  (or: docker compose down)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quickpoll
      POSTGRES_USER: quickpoll
      POSTGRES_PASSWORD: quickpoll123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"        # optional: pgAdmin/DBeaver -> localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickpoll -d quickpoll"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app             # code changes show up instantly
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-dev-secret-key-change-me
      DB_NAME: quickpoll
      DB_USER: quickpoll
      DB_PASSWORD: quickpoll123
      DB_HOST: db          # service name above, NOT localhost
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
